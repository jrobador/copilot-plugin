name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Half the bugs in the first release were Windows-only: localized cmd.exe
    # and taskkill output that English-only matching never caught. Both
    # platforms run on every change.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` enforces the lockfile; `npm install` would happily resolve a
      # different tree. The Copilot runtime lives in plugins/copilot and needs
      # credentials to do anything, so the suite runs against the fake fixture
      # without it.
      - run: npm ci

      # tests/installed-copy.test.mjs really installs the runtime into a copy
      # of the plugin, which downloads the CLI. Once per run is enough.
      - run: npm test
        env:
          COPILOT_TEST_OFFLINE: ${{ (matrix.os == 'ubuntu-latest' && matrix.node == '22') && '0' || '1' }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # JSDoc-typed JavaScript checked by tsc: catches fields that do not exist
      # (`result.error` on an object that never carries one) without a build step.
      - run: npm run typecheck
